<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="230" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.05" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 800; font-size: 38px; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle { font-weight: 500; font-size: 16px; fill: #94a3b8; }
    .badge-text { font-weight: 600; font-size: 12px; fill: #38bdf8; }
    .pill-text { font-weight: 600; font-size: 12px; fill: #cbd5e1; }
  </style>

  <!-- Card Background -->
  <rect width="900" height="230" rx="16" fill="url(#bgGrad)" />
  <rect width="900" height="230" rx="16" stroke="#1e293b" stroke-width="1.5" />

  <!-- Subtle Grid Pattern in background -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40" />
    <line x1="0" y1="80" x2="900" y2="80" />
    <line x1="0" y1="120" x2="900" y2="120" />
    <line x1="0" y1="160" x2="900" y2="160" />
    <line x1="0" y1="200" x2="900" y2="200" />
    <line x1="60" y1="0" x2="60" y2="230" />
    <line x1="180" y1="0" x2="180" y2="230" />
    <line x1="300" y1="0" x2="300" y2="230" />
    <line x1="420" y1="0" x2="420" y2="230" />
    <line x1="540" y1="0" x2="540" y2="230" />
    <line x1="660" y1="0" x2="660" y2="230" />
    <line x1="780" y1="0" x2="780" y2="230" />
  </g>

  <!-- Background Decorative Wave -->
  <path d="M0 160 C 250 200, 450 120, 900 180 L 900 230 L 0 230 Z" fill="url(#waveGrad)" />
  <path d="M0 180 C 300 140, 600 210, 900 160 L 900 230 L 0 230 Z" fill="url(#waveGrad)" opacity="0.6" />

  <!-- Glowing Accent Line -->
  <path d="M 50 215 L 850 215" stroke="url(#cyanGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- Status / Role Badge -->
  <g transform="translate(50, 36)">
    <rect width="180" height="26" rx="13" fill="#0369a1" fill-opacity="0.25" stroke="#0891b2" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#10b981" />
    <text x="26" y="17" class="mono badge-text">BACKEND DEVELOPER</text>
  </g>

  <!-- Main Title -->
  <text x="50" y="108" class="sans title">Nguyen Thanh Son</text>

  <!-- Subtitle -->
  <text x="50" y="142" class="sans subtitle">Node.js &amp; Database Architecture • Scalable APIs • Clean Code</text>

  <!-- Tech Pills on the right -->
  <g transform="translate(610, 50)">
    <!-- Pill 1: NestJS -->
    <g transform="translate(0, 0)">
      <rect width="105" height="32" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="52" y="20" class="mono pill-text" text-anchor="middle">⚡ NestJS</text>
    </g>

    <!-- Pill 2: Node.js -->
    <g transform="translate(115, 0)">
      <rect width="115" height="32" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="57" y="20" class="mono pill-text" text-anchor="middle">🟢 Node.js</text>
    </g>

    <!-- Pill 3: PostgreSQL -->
    <g transform="translate(0, 42)">
      <rect width="115" height="32" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="57" y="20" class="mono pill-text" text-anchor="middle">🐘 Postgres</text>
    </g>

    <!-- Pill 4: Docker -->
    <g transform="translate(125, 42)">
      <rect width="105" height="32" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="52" y="20" class="mono pill-text" text-anchor="middle">🐳 Docker</text>
    </g>

    <!-- Pill 5: RESTful APIs -->
    <g transform="translate(45, 84)">
      <rect width="145" height="30" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#0891b2" stroke-width="1" />
      <text x="72" y="19" class="mono badge-text" text-anchor="middle">🚀 RESTful APIs</text>
    </g>
  </g>
</svg>
